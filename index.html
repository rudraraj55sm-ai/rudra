<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरा लर्निंग ऐप</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            text-align: center;
            margin: 0;
        }
        header {
            background-color: #2563eb;
            color: white;
            padding: 20px;
        }
        .box-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px;
            flex-wrap: wrap;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 240px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button, .pdf-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }
        button:hover, .pdf-btn:hover {
            background-color: #1d4ed8;
        }
        #class-box {
            max-width: 750px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: none;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 15px;
        }
        .tab-btn {
            background-color: #e5e7eb;
            color: #374151;
            font-weight: bold;
            padding: 10px 25px;
        }
        .tab-btn.active {
            background-color: #2563eb;
            color: white;
        }
        .section-content {
            text-align: left;
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
        }
        iframe {
            width: 100%;
            height: 360px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .list-item {
            background: white;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .list-item:hover {
            border-color: #2563eb;
            background-color: #eff6ff;
        }
        .pdf-btn {
            background-color: #16a34a;
            padding: 8px 12px;
            font-size: 13px;
        }
        .pdf-btn:hover {
            background-color: #15803d;
        }
    </style>
</head>
<body>

    <header>
        <h1>मेरा लर्निंग ऐप</h1>
        <p>किसी भी बैच पर क्लिक करें और सभी लेक्चर व PDF देखें</p>
    </header>

    <div class="box-container">
        <div class="card">
            <h2>विज्ञान (Science)</h2>
            <p>सौर मंडल, प्रकाश और मानव शरीर।</p>
            <button onclick="openSubject('science')">बैच खोलें</button>
        </div>

        <div class="card">
            <h2>सामान्य ज्ञान और करंट अफेयर्स</h2>
            <p>अक्टूबर 2026 करंट अफेयर्स, भूगोल और संविधान।</p>
            <button onclick="openSubject('gk')">बैच खोलें</button>
        </div>
    </div>

    <div id="class-box">
        <h2 id="subject-title">विषय का नाम</h2>

        <div class="tabs">
            <button id="btn-video" class="tab-btn active" onclick="switchTab('video')">🎥 सभी वीडियो लेक्चर</button>
            <button id="btn-notes" class="tab-btn" onclick="switchTab('notes')">📄 सभी PDF नोट्स</button>
        </div>

        <div id="video-section" class="section-content">
            <h3 id="current-video-title">लेक्चर का नाम</h3>
            <iframe id="video-player" src="" frameborder="0" allowfullscreen></iframe>
            
            <h4>लेक्चर लिस्ट (चलाने के लिए क्लिक करें):</h4>
            <div id="video-list"></div>
        </div>

        <div id="notes-section" class="section-content" style="display: none;">
            <h3>उपलब्ध PDF नोट्स:</h3>
            <div id="pdf-list"></div>
        </div>
    </div>

    <script>
        const appData = {
            science: {
                title: "विज्ञान बैच (Science Special)",
                videos: [
                    { name: "क्लास 1: सौर मंडल (Solar System)", url: "https://youtube.com" },
                    { name: "क्लास 2: पृथ्वी और उसकी गतियाँ", url: "https://youtube.com" }
                ],
                pdfs: [
                    { title: "नोट्स 1: सौर मंडल मुख्य बिंदु (PDF)", link: "https://w3.org" }
                ]
            },
            gk: {
                title: "सामान्य ज्ञान और करंट अफेयर्स बैच",
                videos: [
                    { name: "क्लास 1: अक्टूबर 2026 मंथली करंट अफेयर्स", url: "https://youtube.com" },
                    { name: "क्लास 2: भारत की प्रमुख नदियाँ", url: "https://youtube.com" },
                    { name: "क्लास 3: भारतीय संविधान की प्रस्तावना", url: "https://youtube.com" }
                ],
                pdfs: [
                    { title: "नोट्स 1: करंट अफेयर्स और भूगोल नोट्स (PDF)", link: "https://w3.org" }
                ]
            }
        };

        function openSubject(subject) {
            const data = appData[subject];
            document.getElementById("subject-title").innerText = data.title;

            playVideo(data.videos[0].name, data.videos[0].url);

            const videoListDiv = document.getElementById("video-list");
            videoListDiv.innerHTML = "";
            
            data.videos.forEach((vid) => {
                videoListDiv.innerHTML += `
                    <div class="list-item">
                        <span>▶️ ${vid.name}</span>
                        <button onclick="playVideo('${vid.name}', '${vid.url}')">देखें</button>
                    </div>
                `;
            });

            const pdfListDiv = document.getElementById("pdf-list");
            pdfListDiv.innerHTML = "";
            
            data.pdfs.forEach((pdf) => {
                pdfListDiv.innerHTML += `
                    <div class="list-item">
                        <span>📄 ${pdf.title}</span>
                        <a href="${pdf.link}" target="_blank" class="pdf-btn">📥 डाउनलोड PDF</a>
                    </div>
                `;
            });

            document.getElementById("class-box").style.display = "block";
            switchTab('video');
        }

        function playVideo(title, url) {
            document.getElementById("current-video-title").innerText = title;
            document.getElementById("video-player").src = url;
        }

        function switchTab(tabName) {
            if (tabName === 'video') {
                document.getElementById("video-section").style.display = "block";
                document.getElementById("notes-section").style.display = "none";
                document.getElementById("btn-video").classList.add("active");
                document.getElementById("btn-notes").classList.remove("active");
            } else {
                document.getElementById("video-section").style.display = "none";
                document.getElementById("notes-section").style.display = "block";
                document.getElementById("btn-notes").classList.add("active");
                document.getElementById("btn-video").classList.remove("active");
            }
        }
    </script>

</body>
</html>
